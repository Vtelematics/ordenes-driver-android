plugins {
    id 'com.onesignal.androidsdk.onesignal-gradle-plugin'
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "ordenese.rider"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

//        signingConfigs {
//            release {
//                storeFile file("C:/AndroidOfficeWork/pranesh jks/OrdeneseCustomer.jks")
//                storePassword 'OrdEnEseDeliVery@354'
//                keyAlias 'OrdEnEseDeliVerYAlias123'
//                keyPassword 'OrdEnEseDeliVery@354'
//            }
//        }

        signingConfigs {
            release {
                storeFile file("C:\\Users\\koush\\AndroidStudioProjects\\ordenes-driver-android\\keystore\\OrdeneseDelivery.jks")
                storePassword 'OrdEnEseDeliVery@354'
                keyAlias 'OrdEnEseDeliVerYAlias123'
                keyPassword 'OrdEnEseDeliVery@354'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

//For avoid Android play store localization issue.
    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'ordenese.rider'

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.5.0'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

/*Image Loader*/
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
/*Image Loader*/
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'

// retrofit, gson
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.retrofit2:retrofit:2.3.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.3.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.3.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.9.0'

// one signal
    implementation 'com.onesignal:OneSignal:[4.0.0, 4.99.99]'

//circle image
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.squareup.picasso:picasso:2.5.2'

//toggle button
    implementation 'com.github.angads25:toggle:1.0.0'

    implementation 'com.intuit.sdp:sdp-android:1.0.6'

// For in-app updates, replacing the old 'play:core' library
    implementation 'com.google.android.play:app-update:2.1.0'

    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-auth'

//    implementation 'com.google.android.gms:play-services:12.0.1'

    //implementation('com.google.firebase:firebase-iid')
    implementation 'com.android.volley:volley:1.2.0'

}